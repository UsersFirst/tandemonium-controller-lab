<!doctype html><html><head><meta charset="utf-8"><title>Screenboard · lab-overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0d0f14;--fg:#e7ecf5;--mut:#8a93a6;--line:rgba(255,255,255,.12)}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
  header h1{font-size:16px;margin:0}header small{color:var(--mut)}
  .row{display:grid;grid-template-columns:200px repeat(1,1fr);gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);align-items:start}
  .row h2{font-size:13px;margin:0 0 4px}.row code{font-size:11px;color:var(--mut)}
  .shot{display:block;max-width:100%;height:auto;max-height:420px;object-fit:contain;background:#000;border:1px solid var(--line);border-radius:6px}
  .fail{color:#ff6b7d;font-size:12px}.cap{font-size:11px;color:var(--mut);margin-top:4px}
  a.mark{font-size:11px;color:#7ae09a;text-decoration:none}
  @media(max-width:900px){.row{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Screenboard · lab-overlay</h1><small>2026-10-18T23:07:56.051Z · 2 shots · 0 failed</small><small>columns: desktop</small></header>
<div class="row"><div><h2>Seat-select · Seats (co-op)</h2><code>lobby-seats</code></div><div><img class="shot" src="lobby-seats.desktop.png" loading="lazy"><div class="cap">desktop 1280×800</div></div></div>
<div class="row"><div><h2>Controllers panel</h2><code>controllers-panel</code></div><div><img class="shot" src="controllers-panel.desktop.png" loading="lazy"><div class="cap">desktop 1280×800</div></div></div>
</body></html>
