<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Players &amp; Controllers</title>
<link rel="stylesheet" href="./lib/ui/tokens.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; background: transparent; user-select: none;
    font-family: var(--uf-font-ui); color: var(--uf-color-fg);
  }
  /* Opaque panel filling the (transparent) window, rounded corners. */
  #panel {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    background: rgba(12,15,20,0.98); border: 1px solid var(--uf-color-line-soft);
    border-radius: 12px; overflow: hidden;
  }
  #titlebar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 9px 12px;
    border-bottom: 1px solid var(--uf-color-surface-2);
    font: 700 11px/1 ui-var(--uf-font-mono), monospace; letter-spacing: 1.4px; color: #9fb0c6; text-transform: uppercase;
  }
  #count { font-weight: 400; color: var(--uf-color-fg-muted); letter-spacing: .3px; }
  #list { flex: 1 1 auto; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 5px; }
  .row {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 9px;
    background: var(--uf-color-surface-3); border: 1px solid rgba(255,255,255,0.09);
  }
  .dot { flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%; background: #39404e; transition: background .08s, box-shadow .08s; }
  .dot.player { background: var(--uf-color-accent); box-shadow: 0 0 8px 1px rgba(95,209,132,0.6); }
  .dot.on { background: var(--uf-color-warn); box-shadow: 0 0 8px 1px rgba(255,209,102,0.8); }
  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  .name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font: 10px/1.3 ui-var(--uf-font-mono), monospace; color: var(--uf-color-fg-muted); }
  .tag { flex: 0 0 auto; font: 800 8px/1 ui-var(--uf-font-mono), monospace; letter-spacing: .7px; padding: 4px 7px; border-radius: 6px; white-space: nowrap; }
  .tag.player { color: var(--uf-color-fg-on-accent); background: var(--uf-color-accent); box-shadow: 0 0 8px -2px var(--uf-color-accent); }
  .tag.reconnecting { color: #1a1205; background: var(--uf-color-warn); }
  .tag.available { color: #c9d6ff; background: rgba(110,168,255,0.18); border: 1px solid rgba(110,168,255,0.4); }
  .empty { font: 11px/1.5 ui-var(--uf-font-mono), monospace; color: var(--uf-color-fg-muted); text-align: center; padding: 18px 8px; }
  .hint { flex: 0 0 auto; padding: 7px 12px; border-top: 1px solid var(--uf-color-surface-2); font: 9px/1.4 ui-var(--uf-font-mono), monospace; color: var(--uf-color-fg-muted); }
  #close-btn {
    position: fixed; top: 7px; right: 8px; width: 20px; height: 20px; background: var(--uf-color-line-soft);
    border: none; border-radius: 50%; color: #ccc; font-size: 13px; line-height: 1; cursor: pointer; z-index: 51;
    display: flex; align-items: center; justify-content: center;
  }
  #close-btn:hover { background: rgba(255,255,255,0.25); color: var(--uf-color-fg); }
</style>
</head>
<body>
  <div id="panel">
    <div id="titlebar">PLAYERS &amp; CONTROLLERS <span id="count"></span></div>
    <div id="list"></div>
    <div class="hint">● player · ● in use now · press a button to join · drag to move</div>
  </div>
  <uf-button size="xs" variant="ghost" id="close-btn" title="Close">&times;</uf-button>
  <script src="js/hud-window-chrome.js"></script>
  <script type="module" src="js/multi-controllers-window.js"></script>
<script type="module" src="./lib/ui/index.js"></script>
</body>
</html>
