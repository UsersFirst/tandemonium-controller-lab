<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Roll HUD</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #eee;
  }
  #hud { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #arc-svg { display: block; width: min(90vw, 220px); height: auto; }
  .gyro-hud-footer {
    position: absolute; left: 0; right: 0; top: 48%;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  #lean-arrow-left, #lean-arrow-right { font-size: 18px; opacity: 0.1; transition: opacity 0.05s; }
  /* Dragging is JS-based (hud-window-chrome.js); the × shows on hovering
     anywhere in the window. */
  #close-btn {
    position: fixed; top: 6px; right: 6px; width: 20px; height: 20px;
    background: rgba(255,255,255,0.12); border: none;
    border-radius: 50%; color: #ccc; font-size: 12px; line-height: 1; cursor: pointer;
    z-index: 51; display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s;
  }
  body:hover #close-btn { opacity: 1; }
  #close-btn:hover { background: rgba(255,255,255,0.25); color: #fff; }
</style>
</head>
<body>
  <div id="hud">
    <svg id="arc-svg" viewBox="-120 -105 240 115">
      <path id="arc-band" d="" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
      <g id="arc-ticks" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"></g>
      <line id="arc-needle" x1="0" y1="-4" x2="0" y2="-22" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2" fill="rgba(255,255,255,0.4)"/>
    </svg>
    <div class="gyro-hud-footer">
      <span id="lean-arrow-left">&#x25C0;</span>
      <span id="lean-arrow-right">&#x25B6;</span>
    </div>
  </div>
  <button id="close-btn" title="Close">&times;</button>
  <script src="js/hud-window-chrome.js"></script>
  <script type="module" src="js/roll-window.js"></script>
</body>
</html>
