name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: controller-core (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      # @usersfirst/controller-core has zero runtime/test dependencies — its
      # tests import only from ./src and use the built-in node:test runner —
      # so no `npm install` is needed. Keeps CI fast and immune to registry
      # flakiness. Add an install step here if a test ever needs a dependency.

      - name: Lint (syntax check)
        run: |
          status=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::syntax error"; status=1; }
          done < <(find packages/core/src packages/core/test -name '*.js')
          exit $status

      - name: Test
        run: node --test
        working-directory: packages/core

      # Visualizer has a small suite of dependency-free unit tests (e.g. the
      # trackpad coordinate math). They import only pure ./src modules — no
      # three — so they run without an install.
      - name: Visualizer unit tests
        run: node --test
        working-directory: packages/visualizer

  ui:
    name: ui kit (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Only `typescript` is needed (tsc --checkJs, no emit). --ignore-scripts
      # skips the overlay's prestart copies; nothing here runs them.
      - run: npm ci --ignore-scripts
      - name: Typecheck @usersfirst/ui
        run: npm run typecheck
      # Browser tests load gallery.html in headless Chrome. Puppeteer is not a
      # dependency of the repo (locally it is borrowed from the sibling game
      # checkout); install it just for this job.
      - name: Install puppeteer for the browser tests
        run: npm i --no-save --no-audit --no-fund puppeteer && npx puppeteer browsers install chrome
      - name: Test @usersfirst/ui (node + browser)
        run: node --test
        working-directory: packages/ui
      # The ratchet: design/audit/thresholds.json are high-water marks that only
      # go down. Only the lab target exists on a CI runner; the game checks itself.
      - name: UI audit ratchet
        run: npm run ui:audit -- --target lab --check
